[package]
name = "rustclr-hal-rp2040"
description = "The HAL traits against real rp2040 hardware"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

# The traits and nothing else. A chip crate that pulled a vendor HAL would
# make the whole workspace depend on it.
[dependencies]
rustclr-hal = { path = "../rustclr-hal", version = "0.1.0", default-features = false }
