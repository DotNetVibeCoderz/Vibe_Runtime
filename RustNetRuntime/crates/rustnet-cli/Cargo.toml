[package]
name = "rustnet-cli"
description = "RustNet Toolchain: build, run, inspect and disassemble assemblies on RustCLR"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustnet"
path = "src/main.rs"

[dependencies]
rustclr-flashfs = { path = "../rustclr-flashfs" }
rustclr-device = { path = "../rustclr-device" }
rustclr-rndp = { path = "../rustclr-rndp" }
rustclr-crypto = { path = "../rustclr-crypto" }
rustclr-core.workspace = true
rustclr-bcl.workspace = true
rustclr-gc.workspace = true
rustclr-metadata.workspace = true
rustclr-interop.workspace = true
rustclr-jit.workspace = true
# The simulated board `run --board host` installs.
rustclr-hal.workspace = true
rustclr-hal-host.workspace = true
