[package]
name = "rustclr-sched"
description = "Threading, task scheduling and concurrency primitives for RustCLR"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# The thread pool and channels. Without it only the lock-free queue is built
# (no_std + alloc, over `rustclr-thread`), which is what the runtime's task
# pool needs.
std = ["rustclr-thread/std"]

[dependencies]
rustclr-thread = { path = "../rustclr-thread", version = "0.1.0", default-features = false }
